name: Visual Guard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Ensure dev/test requirements are installed
        pip install scikit-image numpy imagehash pillow selenium

    - name: Run Verification Script
      run: |
        # Run the demo script which acts as our test suite for now
        python examples/v020_demo.py
        
    - name: Run Browser Test (Report Gen)
      run: |
        python examples/browser_demo.py

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-report-${{ matrix.python-version }}
        path: |
          visual_report.html
          tests_browser/
          tests_v020/

    - name: Check SSIM Availability
      run: |
        python -c "import skimage.metrics; print('SSIM available')"
